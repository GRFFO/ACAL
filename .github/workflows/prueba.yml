name: Prueba en Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "cliente/**"
      - "pruebas/**"

jobs:
  prueba:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python pruebas/prueba_windows.py
        env:
          PYTHONIOENCODING: utf-8
      - run: python pruebas/prueba_clics.py
        env:
          PYTHONIOENCODING: utf-8
